<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recette structured recognition audit</title>
  <style>
    body { margin:20px; font:14px/1.4 Arial,sans-serif; color:#111; background:#f4f4f1; }
    pre { padding:16px; border-left:5px solid #ffcd23; background:#fff; white-space:pre-wrap; }
    iframe { position:fixed; width:1px; height:1px; border:0; opacity:.01; pointer-events:none; }
  </style>
</head>
<body data-status="running">
  <h1>Recette structured recognition audit</h1>
  <pre id="result">Running the production crop, grid and cell-classification pipeline...</pre>
  <iframe id="app" src="../index.html?ocrDebug=1&fixture=structured"></iframe>
  <script src="../recipe-ocr-engine.js?v=5.21.0"></script>
  <script>
  "use strict";

  const reference21 = [
    ["A1","C1","C1"],["AHR","B1","B1"],["A1","A1","C1"],
    ["A1","C1","C1"],["AHR","B1","B1"],["A1","C1","C1"],
    ["A1","C1","C1"],["A1","A1","C1"],["A1","A1","AHR"],
    ["A1","C1","C1"],["A1","C1","C1"],["A1","A1","AHR"],
    ["A1","A1","A1"],["A1","C1","C1"],["A1","C1","C1"],
    ["A1","A1","AHR"],["A1","C1","C1"],["A1","A1","A1"],
    ["A1","A1","AHR"],["A1","C1","C1"],["A1","C1","C1"]
  ];

  const reference36 = [
    ["A1","C1","Ore/Neige"],["A1","AHR","C1"],["A1","B1","BHR"],
    ["A1","C1","C1"],["A1","C1","C1"],["A1","C1","Ore/Neige"],
    ["AHR","C1","C1"],["A1","C1","C1"],["A1","B1","BHR"],
    ["A1","C1","Ore/Neige"],["BHR","C1","C1"],["A1","C1","C1"],
    ["A1","C1","C1"],["A1","C1","C1"],["A1","B1","BHR"],
    ["BHR","C1","C1"],["A1","A1","BHR"],["C1",null,null],
    ["A1","C1","Ore/Neige"],["AHR","C1","C1"],["A1","B1","BHR"],
    ["A1","C1","C1"],["A1","C1","C1"],["A1","C1","Ore/Neige"],
    ["AHR","C1","C1"],["A1","C1","C1"],["A1","B1","BHR"],
    ["A1","A1","AHR"],["AHR","C1","C1"],["A1","C1","C1"],
    ["A1","C1","C1"],["A1","C1","C1"],["A1","B1","BHR"],
    ["BHR","C1","C1"],["A1","A1","BHR"],["A1","C1","C1"]
  ];

  const expectations = {
    21:{ trips:21, buckets:63, tonnes:"777.0", materials:{ A1:29, AHR:6, B1:4, C1:24 } },
    36:{ trips:36, buckets:106, tonnes:"1307.3", materials:{ A1:31, AHR:6, "Ore/Neige":5, B1:6, BHR:11, C1:47 } }
  };

  function drawRecipe(rows, options = {}){
    const widths = [110, 150, 220, 220, 220];
    const rowHeight = options.rowHeight || 48;
    const headerHeight = 58;
    const left = 70;
    const top = 80;
    const tableWidth = widths.reduce((sum, value) => sum + value, 0);
    const tableHeight = headerHeight + rows.length * rowHeight;
    const canvas = document.createElement("canvas");
    canvas.width = tableWidth + 140;
    canvas.height = tableHeight + 160;
    const context = canvas.getContext("2d");
    context.fillStyle = options.paper || "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "#1264a3";
    context.fillRect(left, top, tableWidth, headerHeight);
    context.strokeStyle = options.grid || "#15202b";
    context.lineWidth = options.lineWidth || 3;
    context.strokeRect(left, top, tableWidth, tableHeight);
    let x = left;
    widths.forEach(width => {
      context.beginPath(); context.moveTo(x, top); context.lineTo(x, top + tableHeight); context.stroke(); x += width;
    });
    context.beginPath(); context.moveTo(left + tableWidth, top); context.lineTo(left + tableWidth, top + tableHeight); context.stroke();
    for (let row = 0; row <= rows.length; row++) {
      const y = top + headerHeight + row * rowHeight;
      context.beginPath(); context.moveTo(left, y); context.lineTo(left + tableWidth, y); context.stroke();
    }
    const labels = ["Quart", "Camion", "Godet 1", "Godet 2", "Godet 3"];
    context.textBaseline = "middle";
    context.textAlign = "center";
    context.font = "700 24px Arial";
    context.fillStyle = "#fff";
    x = left;
    labels.forEach((label, index) => { context.fillText(label, x + widths[index] / 2, top + headerHeight / 2); x += widths[index]; });
    context.font = `${options.weight || 700} ${options.fontSize || 25}px ${options.font || "Arial"}`;
    context.fillStyle = options.ink || "#111";
    rows.forEach((buckets, rowIndex) => {
      const values = ["1", String((options.startTruck || 1) + rowIndex), ...buckets];
      let cellX = left;
      values.forEach((value, columnIndex) => {
        const jitter = ((rowIndex * 3 + columnIndex * 2) % 5 - 2) * (options.jitter ?? 1);
        if (value) context.fillText(value, cellX + widths[columnIndex] / 2 + jitter, top + headerHeight + rowIndex * rowHeight + rowHeight / 2);
        cellX += widths[columnIndex];
      });
    });
    if (options.shadow) {
      const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "rgba(30,20,5,.18)");
      gradient.addColorStop(.55, "rgba(255,255,255,0)");
      gradient.addColorStop(1, "rgba(30,20,5,.1)");
      context.fillStyle = gradient;
      context.fillRect(0, 0, canvas.width, canvas.height);
    }
    return { canvas, corners:[
      { x:left / canvas.width, y:top / canvas.height },
      { x:(left + tableWidth) / canvas.width, y:top / canvas.height },
      { x:(left + tableWidth) / canvas.width, y:(top + tableHeight) / canvas.height },
      { x:left / canvas.width, y:(top + tableHeight) / canvas.height }
    ] };
  }

  function sorted(value){ return Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b))); }

  async function runReference(app, rows, options = {}){
    const startedAt = Date.now();
    const fixture = drawRecipe(rows, options);
    const source = options.turns ? RecetteOcrEngine.rotateCanvas(fixture.canvas, options.turns) : fixture.canvas;
    const prepared = options.turns
      ? RecetteOcrEngine.prepare(source)
      : RecetteOcrEngine.prepare(source, { forcedTurns:0, manualCorners:fixture.corners });
    if (!prepared.ok) throw new Error(`prepare failed (${rows.length}): ${prepared.error}`);
    const recognition = await app.readRecipeSegmentedCells(prepared, 0);
    const quality = app.evaluateRecipeRecognition(prepared, recognition);
    const issues = app.recipeImportIssues(recognition.rows);
    const summary = app.recipeDraftSummary(recognition.rows);
    const expected = expectations[rows.length];
    const actual = {
      trips:summary.trips,
      buckets:summary.buckets,
      tonnes:summary.plannedTonnes.toFixed(1),
      materials:sorted(summary.materials),
      uncertain:recognition.cells.filter(cell => cell.status === "uncertain").length,
      uncertainDetails:recognition.cells.filter(cell => cell.status === "uncertain").slice(0, 6).map(cell => ({
        row:cell.row,
        column:cell.column,
        raw:cell.rawOcrText,
        candidates:cell.candidates?.slice(0, 3),
        margin:cell.visualMargin
      })),
      outcome:quality.outcome
    };
    const pass = issues.length === 0 && actual.trips === expected.trips && actual.buckets === expected.buckets &&
      actual.tonnes === expected.tonnes && JSON.stringify(actual.materials) === JSON.stringify(sorted(expected.materials)) &&
      actual.outcome === "review";
    return { name:`reference-${rows.length}${options.turns ? "-rotated" : ""}`, pass, elapsedMs:Date.now() - startedAt, actual, expected, diagnostics:{ rows:prepared.grid.dataRowCount, columns:prepared.grid.columnCount } };
  }

  function makeCell(value, options = {}){
    const canvas = document.createElement("canvas");
    canvas.width = 250;
    canvas.height = 92;
    const context = canvas.getContext("2d");
    context.fillStyle = options.paper || "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = options.ink || "#111";
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.font = `${options.weight || 700} ${options.size || 48}px ${options.font || "Arial"}`;
    context.fillText(value, canvas.width / 2 + (options.jitterX || 0), canvas.height / 2 + (options.jitterY || 0));
    return { canvas, rawCanvas:canvas, blank:false };
  }

  function runGeneralizedCells(app){
    const codes = app.activeRecipeCodes();
    let seed = 918273;
    const random = () => ((seed = seed * 1664525 + 1013904223 >>> 0) / 4294967296);
    const failures = [];
    let reviewCases = 0;
    let autoResolved = 0;
    const fonts = ["Arial", "Helvetica", "Arial Narrow"];
    const weights = [400, 600, 700];
    for (let index = 0; index < 180; index++) {
      const code = codes[Math.floor(random() * codes.length)];
      const cell = makeCell(code, {
        font:fonts[Math.floor(random() * fonts.length)],
        weight:weights[Math.floor(random() * weights.length)],
        size:42 + Math.floor(random() * 15),
        jitterX:Math.round((random() - .5) * 12),
        jitterY:Math.round((random() - .5) * 7),
        paper:random() > .5 ? "#fff" : "#eee9d8",
        ink:random() > .5 ? "#111" : "#303030"
      });
      const result = app.classifyRecipeMaterialCell(cell, index % 3 ? code : "", index % 3 ? .78 : 0, { correctColumn:true, validRowAlignment:true, rowOrder:true });
      const rankedCodes = result.candidates.slice(0, 3).map(candidate => candidate.code);
      if (result.status === "recognized" && result.value === code) autoResolved++;
      else if (result.status === "uncertain" && rankedCodes.includes(code)) reviewCases++;
      else failures.push({ index, code, result });
    }
    const unknown = app.classifyRecipeMaterialCell(makeCell("ZX9"), "ZX9", .91, { correctColumn:true, validRowAlignment:true, rowOrder:true });
    const malformed = ["DA", "AD", "AA", "MA", "JA1", "JAHR", "CELLUL", "LODET", "GODE", "TOMO"]
      .map(value => ({ value, evidence:app.constrainedOcrEvidence(value) }));
    const nonOne = app.normalizeRecipeRows(Array.from({ length:17 }, () => ({ buckets:["A1", null, null] })), 41);
    const pass = failures.length === 0 && unknown.status === "uncertain" && !unknown.value &&
      malformed.every(item => !item.evidence.code) && nonOne[0].truck === "41" && nonOne.at(-1).truck === "57";
    return { name:"randomized-independent-cells", pass, autoResolved, reviewCases, failures:failures.slice(0, 8), unknown:{ status:unknown.status, value:unknown.value, candidates:unknown.candidates.slice(0, 3) }, malformed, nonOne:[nonOne[0].truck, nonOne.at(-1).truck] };
  }

  function runDynamicGeometry(app){
    const codes = app.activeRecipeCodes();
    const counts = [1, 17, 21, 36, 47, 60];
    const results = counts.map(count => {
      const rows = Array.from({ length:count }, (_, rowIndex) => Array.from({ length:3 }, (_, bucketIndex) => {
        if ((rowIndex + bucketIndex) % 11 === 0 && bucketIndex > 0) return null;
        return codes[(rowIndex * 5 + bucketIndex * 7) % codes.length];
      }));
      const fixture = drawRecipe(rows, { startTruck:41, rowHeight:count > 47 ? 38 : 48, weight:rowIndexWeight(count) });
      const prepared = RecetteOcrEngine.prepare(fixture.canvas, { forcedTurns:0, manualCorners:fixture.corners });
      return { count, ok:prepared.ok, detected:prepared.grid?.dataRowCount, cells:RecetteOcrEngine.buildCellPlan(prepared).length, horizontal:count === 1 ? prepared.grid?.horizontalLines : undefined, strengths:count === 1 ? prepared.grid?.horizontalLineScores : undefined };
    });
    const base = drawRecipe(reference21);
    const skew = .075;
    const skewed = document.createElement("canvas");
    skewed.width = base.canvas.width + Math.ceil(base.canvas.height * skew) + 30;
    skewed.height = base.canvas.height;
    const context = skewed.getContext("2d");
    context.fillStyle = "#fff";
    context.fillRect(0, 0, skewed.width, skewed.height);
    context.setTransform(1, 0, skew, 1, 0, 0);
    context.drawImage(base.canvas, 0, 0);
    const skewCorners = base.corners.map(point => {
      const x = point.x * base.canvas.width;
      const y = point.y * base.canvas.height;
      return { x:(x + skew * y) / skewed.width, y:y / skewed.height };
    });
    const perspective = RecetteOcrEngine.prepare(skewed, { forcedTurns:0, manualCorners:skewCorners });
    const pass = results.every(result => result.ok && result.detected === result.count && result.cells === result.count * 3) &&
      perspective.ok && perspective.grid.dataRowCount === reference21.length && perspective.grid.columnCount === 5;
    return { name:"dynamic-grid-and-perspective", pass, results, perspective:{ ok:perspective.ok, rows:perspective.grid?.dataRowCount, columns:perspective.grid?.columnCount, dimensions:perspective.debug?.perspectiveCorrectedDimensions } };
  }

  function rowIndexWeight(count){ return count % 2 ? 600 : 700; }

  document.getElementById("app").addEventListener("load", async event => {
    const output = document.getElementById("result");
    try {
      const app = event.currentTarget.contentWindow.__recetteOcrTest;
      if (!app) throw new Error("Local structured-recognition test API unavailable");
      const results = [];
      results.push(runDynamicGeometry(app));
      if (new URLSearchParams(location.search).has("geometryOnly")) {
        const pass = results.every(result => result.pass);
        document.body.dataset.status = pass ? "pass" : "fail";
        output.textContent = JSON.stringify({ pass, results }, null, 2);
        return;
      }
      results.push(runGeneralizedCells(app));
      results.push(await runReference(app, reference21));
      results.push(await runReference(app, reference36, { shadow:true, font:"Helvetica" }));
      results.push(await runReference(app, reference21, { turns:1 }));
      const pass = results.every(result => result.pass);
      document.body.dataset.status = pass ? "pass" : "fail";
      output.textContent = JSON.stringify({ pass, results }, null, 2);
    } catch(error) {
      document.body.dataset.status = "fail";
      output.textContent = JSON.stringify({ pass:false, error:String(error?.stack || error) }, null, 2);
    }
  });
  </script>
</body>
</html>
